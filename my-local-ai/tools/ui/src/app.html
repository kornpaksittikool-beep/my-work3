<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="favicon.ico" sizes="48x48" />
		<link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
	<style>
		html,
		body {
			margin: 0;
			min-height: 100%;
			background: #0f1115;
			color: #f5f7fa;
			font-family:
				Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
				sans-serif;
		}

		#boot-shell {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				radial-gradient(circle at top, rgba(74, 222, 128, 0.12), transparent 35%),
				linear-gradient(180deg, #12151b 0%, #0b0d12 100%);
			z-index: 9999;
			transition: opacity 180ms ease;
		}

		body[data-app-ready='true'] #boot-shell {
			opacity: 0;
			pointer-events: none;
		}

		.boot-shell-card {
			width: min(28rem, calc(100vw - 3rem));
			padding: 1.25rem 1.5rem;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 1rem;
			background: rgba(19, 23, 31, 0.92);
			box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
		}

		.boot-shell-title {
			margin: 0 0 0.4rem;
			font-size: 1.05rem;
			font-weight: 600;
		}

		.boot-shell-text {
			margin: 0;
			color: rgba(245, 247, 250, 0.72);
			font-size: 0.92rem;
			line-height: 1.45;
		}

		.boot-shell-progress {
			position: relative;
			margin-top: 1rem;
			height: 0.35rem;
			overflow: hidden;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.08);
		}

		.boot-shell-progress::after {
			content: '';
			position: absolute;
			inset: 0;
			width: 38%;
			border-radius: inherit;
			background: linear-gradient(90deg, #22c55e, #60a5fa);
			animation: boot-shell-slide 1.1s ease-in-out infinite;
		}

		@keyframes boot-shell-slide {
			0% {
				transform: translateX(-100%);
			}
			100% {
				transform: translateX(320%);
			}
		}
	</style>
	%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
	<div id="boot-shell" aria-hidden="true">
		<div class="boot-shell-card">
			<p class="boot-shell-title">Starting my-local-ai UI</p>
			<p class="boot-shell-text">
				Loading the dev app, connecting to llama-server, and preparing the first screen...
			</p>
			<div class="boot-shell-progress"></div>
		</div>
	</div>
	<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
